name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node --test

  build:
    # Build with both ends of the supported Hugo range: the oldest version
    # the template promises to work on, and whatever is current.
    name: Hugo ${{ matrix.hugo }} build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hugo: ['0.139.4', 'latest']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ matrix.hugo }}
          extended: true
      - run: hugo --minify --logLevel info
