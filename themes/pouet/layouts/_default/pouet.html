{{ define "main" }}
<div class="wrap" style="min-height: 60vh; display: flex; align-items: center; justify-content: center;">
  <h1 style="font-weight: 700; letter-spacing: -0.02em; text-align: center;">
    I use <span class="pouet-word" aria-label="pouet">{{ range $i, $c := split "pouet" "" }}<span class="pouet-letter" data-animate="pouet-letter" style="color: var(--brand-red); display: inline-block;">{{ $c }}</span>{{ end }}</span> btw
  </h1>
</div>
{{ end }}

{{ define "scripts" }}
<script>
document.addEventListener('DOMContentLoaded', function () {
  var letters = document.querySelectorAll('.pouet-letter');
  if (!letters.length) return;
  if (typeof gsap === 'undefined' || !document.documentElement.classList.contains('js-motion')) {
    letters.forEach(function (el) { el.style.opacity = 1; });
    return;
  }
  gsap.fromTo(letters,
    { opacity: 0, y: 24, rotation: -8 },
    { opacity: 1, y: 0, rotation: 0, duration: 0.55, stagger: 0.09, ease: 'back.out(2)', delay: 0.35 }
  );
});
</script>
{{ end }}
